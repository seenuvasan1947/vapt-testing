name: URL Scanner

on:
  push:
    branches:
      - v1.0

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 2

      - name: Get new URLs from git diff
        id: get_urls
        run: |
          git diff HEAD^ HEAD targets.txt | grep '^+' | sed 's/^+//' | grep -F '|||' > new_targets.txt || true
          echo "New targets found:"
          cat new_targets.txt

      - name: Scan each new URL
        run: |
          mkdir -p results
          if [ ! -s new_targets.txt ]; then
            echo "No new targets to scan"
            exit 0
          fi
          while read -r line; do
            if [ -z "$line" ] || [[ "$line" == \#* ]]; then
              continue
            fi
            # Extract domain (field 1)
            url=$(echo "$line" | awk -F'[|][|][|]' '{print $1}')
            # Extract all flags (field 2 onwards) and join with spaces
            flags=$(echo "$line" | awk -F'[|][|][|]' '{for(i=2;i<=NF;i++) printf "%s ", $i}' | xargs)
            echo "Scanning: $url with flags: ${flags:---mode medium}"
            if [ -z "$flags" ]; then
              docker run --rm -v "${PWD}/results:/results" cyberseenu/vapt-automation-scanner:v1.0.0 "$url" --mode medium
            else
              docker run --rm -v "${PWD}/results:/results" cyberseenu/vapt-automation-scanner:v1.0.0 "$url" "$flags"
            fi
          done < new_targets.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: results/
