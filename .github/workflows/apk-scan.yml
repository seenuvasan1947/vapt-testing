name: APK Scanner

on:
  push:
    branches:
      - apk-extracter-v1
    paths:
      - apk-target.txt

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get new scan targets from git diff
        id: get_targets
        run: |
          git diff HEAD^ HEAD apk-target.txt | grep '^+[^+]' | sed 's/^+//' | grep '|||' > new_apk-target.txt || true
          echo "New targets found:"
          cat new_apk-target.txt

      - name: Debug - Show secrets in use (PLAIN TEXT)
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          echo "=== SECRETS IN USE (PLAIN TEXT) ==="
          echo "BOT_TOKEN=$BOT_TOKEN"
          echo "CHAT_ID=$CHAT_ID"
          echo "API_ID=$API_ID"
          echo "API_HASH=$API_HASH"
          echo "SESSION=$SESSION"
          echo "===================================="

      - name: Install dependencies
        run: |
          pip install -q pyrogram tgcrypto

      - name: Pull Docker image
        run: docker pull cyberseenu/apk-scanner:1.0.3

      - name: Scan each new target
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: |
          mkdir -p results downloads

          if [ ! -s new_apk-target.txt ]; then
            echo "No new targets to scan"
            exit 0
          fi

          # Helper: find latest Telegram document matching a filename and download it
          fetch_from_telegram() {
            local target_name="$1"
            local dest="$2"

            echo "Searching Telegram for: $target_name"

            # Get recent updates (no offset — scan last 100 pending updates)
            UPDATES=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?limit=100&timeout=0")

            # Extract file_id of the latest document matching the filename
            FILE_ID=$(echo "$UPDATES" | python3 - << 'PYEOF'
          import sys, json, os

          target = os.environ.get('TARGET_NAME', '')
          raw = sys.stdin.read()
          try:
              data = json.loads(raw)
          except Exception:
              sys.exit(1)

          updates = data.get('result', [])
          found_id = ''
          for update in updates:
              msg = update.get('message') or update.get('channel_post')
              if not msg:
                  continue
              doc = msg.get('document')
              if doc and os.path.basename(doc.get('file_name', '')) == os.path.basename(target):
                  found_id = doc['file_id']   # keep iterating — last (latest) wins

          print(found_id)
          PYEOF
          )

            if [ -z "$FILE_ID" ]; then
              echo "ERROR: '$target_name' not found in repo or Telegram. Skipping."
              return 1
            fi

            # Get download URL
            FILE_PATH=$(curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${FILE_ID}" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['file_path'])")

            curl -s -o "$dest" "https://api.telegram.org/file/bot${BOT_TOKEN}/${FILE_PATH}"
            echo "Downloaded from Telegram: $target_name"
            return 0
          }

          while read -r line; do
            # Skip empty lines and comments
            if [ -z "$line" ] || [[ "$line" == \#* ]]; then
              continue
            fi

            # Parse filename and flags using ||| separator
            filename=$(echo "$line" | cut -d'|' -f1 | xargs)
            flags=$(echo "$line"    | cut -d'|' -f4- | xargs)

            echo "========================================"
            echo "File  : $filename"
            echo "Flags : $flags"
            echo "========================================"

            basename=$(basename "$filename")

            # 1. Try to find file in repo
            filepath=$(find . -name "$basename" ! -path "./.git/*" ! -path "./downloads/*" | head -1)

            if [ -n "$filepath" ]; then
              abs_path="${{ github.workspace }}/${filepath#./}"
              echo "Found in repo: $abs_path"
            else
              echo "Not found in repo — trying Telegram..."
              dl_dest="${{ github.workspace }}/downloads/$basename"
              export TARGET_NAME="$basename"
              if ! fetch_from_telegram "$basename" "$dl_dest"; then
                continue
              fi
              abs_path="$dl_dest"
            fi

            # Clear previous results before each scan
            find results/ -type f -delete 2>/dev/null || true

            # Run scanner
            docker run --rm \
              -v "$abs_path:/input/$basename" \
              -v "${{ github.workspace }}/results:/output" \
              cyberseenu/apk-scanner:1.0.3 \
              scan "/input/$basename" \
              --skip-sonar \
              $flags < /dev/null

            # Send result ZIPs to Telegram
            result_zips=$(find results/ -name "*.zip" | sort)
            if [ -z "$result_zips" ]; then
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                -d chat_id="${CHAT_ID}" \
                -d text="✅ Scan complete for ${basename} — no ZIP output generated."
            else
              python3 << 'TGEOF'
          import os, sys
          from pathlib import Path

          result_zips = """$result_zips""".strip().split('\n')
          basename = """${basename}"""
          BOT_TOKEN = os.environ['BOT_TOKEN']
          CHAT_ID = os.environ['CHAT_ID']
          API_ID = int(os.environ['API_ID'])
          API_HASH = os.environ['API_HASH']
          SESSION = os.environ['SESSION']

          import subprocess
          def send_bot_api(filepath, caption):
              """Send via Bot API (≤50MB)"""
              cmd = ['curl', '-s',
                     '-F', f'chat_id={CHAT_ID}',
                     '-F', f'caption={caption}',
                     '-F', f'document=@{filepath}',
                     f'https://api.telegram.org/bot{BOT_TOKEN}/sendDocument']
              subprocess.run(cmd)

          def send_pyrogram(filepath, caption):
              """Send via Pyrogram user account (up to 2GB)"""
              try:
                  from pyrogram import Client
                  app = Client('tg_session', api_id=API_ID, api_hash=API_HASH,
                               session_string=SESSION, no_updates=True)
                  with app:
                      for _ in app.get_dialogs(): pass  # preload peer cache
                      app.send_document(chat_id=int(CHAT_ID), document=filepath,
                                       caption=caption)
                  print(f"Sent via Pyrogram: {filepath}")
              except Exception as e:
                  print(f"Pyrogram error: {e}")
                  return False
              return True

          for rzip in result_zips:
              if not rzip or not Path(rzip).exists():
                  continue

              size_bytes = Path(rzip).stat().st_size
              size_mb = size_bytes / (1024 * 1024)
              caption = f"✅ Results: {basename}"

              if size_bytes <= 52428800:  # 50 MB
                  print(f"Sending {Path(rzip).name} ({size_mb:.1f}MB) via Bot API...")
                  send_bot_api(rzip, caption)
              else:
                  print(f"Sending {Path(rzip).name} ({size_mb:.1f}MB) via Pyrogram...")
                  if send_pyrogram(rzip, caption):
                      print(f"✅ Sent via Pyrogram: {size_mb:.1f}MB")
                  else:
                      print(f"Failed to send {rzip}")
          TGEOF
            fi

          done < new_apk-target.txt

      - name: Upload scan results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-scan-results
          path: results/
          retention-days: 30
          if-no-files-found: warn
