name: APK Scanner

on:
  push:
    branches:
      - apk-extracter-v1
    paths:
      - apk-target.txt

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get new scan targets
        run: |
          git diff HEAD^ HEAD apk-target.txt | grep '^+[^+]' | sed 's/^+//' | grep '|||' > new_apk-target.txt || true
          cat new_apk-target.txt

      - name: Install deps
        run: pip install -q pyrogram tgcrypto requests

      - name: Pull Docker image
        run: docker pull cyberseenu/apk-scanner:1.0.3

      - name: Scan
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          API_ID:    ${{ secrets.TELEGRAM_API_ID }}
          API_HASH:  ${{ secrets.TELEGRAM_API_HASH }}
          SESSION:   ${{ secrets.TELEGRAM_SESSION }}
        run: |
          mkdir -p results downloads

          fetch_from_telegram() {
            local target_name="$1"
            local dest="$2"

            echo "Searching Telegram for: $target_name"

            TARGET_NAME="$target_name" DEST_PATH="$dest" python3 << 'PYEOF'
import asyncio
import os
import sys
from pyrogram import Client

API_ID = int(os.environ["API_ID"])
API_HASH = os.environ["API_HASH"]
SESSION = os.environ["SESSION"]
CHAT_ID = int(os.environ["CHAT_ID"])
target_name = os.environ["TARGET_NAME"]
dest_path = os.environ["DEST_PATH"]

async def main():
    app = Client(
        "tg_runtime",
        api_id=API_ID,
        api_hash=API_HASH,
        session_string=SESSION,
        no_updates=True,
    )

    await app.start()

    # FIX: load dialogs
    async for _ in app.get_dialogs():
        break

    try:
        async for msg in app.search_messages(
            chat_id=CHAT_ID,
            query=target_name,
            limit=20
        ):
            if not msg.document:
                continue

            current = os.path.basename(msg.document.file_name or "")

            if os.path.basename(target_name) in current:
                os.makedirs(os.path.dirname(dest_path), exist_ok=True)
                await msg.download(file_name=dest_path)
                print("Downloaded:", current)
                return
    finally:
        await app.stop()

    print("ERROR: file not found", file=sys.stderr)
    raise SystemExit(1)

asyncio.run(main())
PYEOF

            if [ $? -ne 0 ]; then
              return 1
            fi
          }

          while read -r line; do
            [ -z "$line" ] && continue

            filename=$(echo "$line" | cut -d'|' -f1 | xargs)
            flags=$(echo "$line" | cut -d'|' -f4- | xargs)

            basename=$(basename "$filename")

            filepath=$(find . -name "$basename" ! -path "./downloads/*" | head -1)

            if [ -n "$filepath" ]; then
              abs_path="${{ github.workspace }}/${filepath#./}"
            else
              dl_dest="${{ github.workspace }}/downloads/$basename"
              fetch_from_telegram "$basename" "$dl_dest" || continue
              abs_path="$dl_dest"
            fi

            find results/ -type f -delete || true

            docker run --rm \
              -v "$abs_path:/input/$basename" \
              -v "${{ github.workspace }}/results:/output" \
              cyberseenu/apk-scanner:1.0.3 \
              scan "/input/$basename" --skip-sonar $flags

            result_zips=$(find results/ -name "*.zip")

            if [ -z "$result_zips" ]; then
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                -d chat_id="${CHAT_ID}" \
                -d text="✅ Done: ${basename}"
            else
              for file in $result_zips; do
                curl -s -F chat_id="${CHAT_ID}" \
                     -F document=@"$file" \
                     "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
              done
            fi

          done < new_apk-target.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-results
          path: results/