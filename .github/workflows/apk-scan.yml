name: APK Scanner

on:
  push:
    branches:
      - apk-extracter-v1
    paths:
      - apk-target.txt

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get new scan targets from git diff
        run: |
          git diff HEAD^ HEAD apk-target.txt | grep '^+[^+]' | sed 's/^+//' | grep '|||' > new_apk-target.txt || true
          echo "New targets found:"
          cat new_apk-target.txt

      - name: Install dependencies
        run: |
          pip install -q pyrogram tgcrypto requests

      - name: Pull Docker image
        run: docker pull cyberseenu/apk-scanner:1.0.3

      - name: Scan each new target
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          API_ID:    ${{ secrets.TELEGRAM_API_ID }}
          API_HASH:  ${{ secrets.TELEGRAM_API_HASH }}
          SESSION:   ${{ secrets.TELEGRAM_SESSION }}
        run: |
          mkdir -p results downloads

          if [ ! -s new_apk-target.txt ]; then
            echo "No new targets to scan"
            exit 0
          fi

          fetch_from_telegram() {
            local target_name="$1"
            local dest="$2"

            echo "Searching Telegram for: $target_name"

            TARGET_NAME="$target_name" DEST_PATH="$dest" python3 - << 'PYEOF'
import asyncio
import os
import sys
from pyrogram import Client

API_ID = int(os.environ["API_ID"])
API_HASH = os.environ["API_HASH"]
SESSION = os.environ["SESSION"]
CHAT_ID = int(os.environ["CHAT_ID"])
target_name = os.environ["TARGET_NAME"]
dest_path = os.environ["DEST_PATH"]

async def main():
    app = Client(
        "tg_runtime",
        api_id=API_ID,
        api_hash=API_HASH,
        session_string=SESSION,
        no_updates=True,
    )

    await app.start()

    # 🔥 CRITICAL: load peer cache (fixes CI failure)
    async for _ in app.get_dialogs():
        break

    try:
        async for msg in app.search_messages(
            chat_id=CHAT_ID,
            query=target_name,
            limit=20
        ):
            if not msg.document:
                continue

            current_name = os.path.basename(msg.document.file_name or "")

            # 🔥 safer match
            if os.path.basename(target_name) in current_name:
                os.makedirs(os.path.dirname(dest_path), exist_ok=True)
                await msg.download(file_name=dest_path)
                print(f"Downloaded from Telegram: {current_name}")
                return

    finally:
        await app.stop()

    print(f"ERROR: '{target_name}' not found in Telegram.", file=sys.stderr)
    raise SystemExit(1)

asyncio.run(main())
PYEOF

            if [ $? -ne 0 ]; then
              echo "ERROR: '$target_name' not found in repo or Telegram. Skipping."
              return 1
            fi

            return 0
          }

          while read -r line; do
            if [ -z "$line" ] || [[ "$line" == \#* ]]; then
              continue
            fi

            filename=$(echo "$line" | cut -d'|' -f1 | xargs)
            flags=$(echo "$line" | cut -d'|' -f4- | xargs)

            echo "========================================"
            echo "File  : $filename"
            echo "Flags : $flags"
            echo "========================================"

            basename=$(basename "$filename")

            filepath=$(find . -name "$basename" ! -path "./.git/*" ! -path "./downloads/*" | head -1)

            if [ -n "$filepath" ]; then
              abs_path="${{ github.workspace }}/${filepath#./}"
              echo "Found in repo: $abs_path"
            else
              echo "Not found in repo — trying Telegram..."
              dl_dest="${{ github.workspace }}/downloads/$basename"
              if ! fetch_from_telegram "$basename" "$dl_dest"; then
                continue
              fi
              abs_path="$dl_dest"
            fi

            find results/ -type f -delete 2>/dev/null || true

            docker run --rm \
              -v "$abs_path:/input/$basename" \
              -v "${{ github.workspace }}/results:/output" \
              cyberseenu/apk-scanner:1.0.3 \
              scan "/input/$basename" \
              --skip-sonar \
              $flags < /dev/null

            result_zips=$(find results/ -name "*.zip" | sort)

            if [ -z "$result_zips" ]; then
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                -d chat_id="${CHAT_ID}" \
                -d text="✅ Scan complete for ${basename} — no ZIP output generated."
            else
              RESULT_ZIPS="$result_zips" TARGET_BASENAME="$basename" python3 - << 'TGEOF'
import os
from pathlib import Path
import subprocess

result_zips = [p for p in os.environ.get("RESULT_ZIPS", "").splitlines() if p.strip()]
basename = os.environ["TARGET_BASENAME"]
BOT_TOKEN = os.environ['BOT_TOKEN']
CHAT_ID = os.environ['CHAT_ID']
API_ID = int(os.environ['API_ID'])
API_HASH = os.environ['API_HASH']
SESSION = os.environ['SESSION']

def send_bot_api(filepath, caption):
    subprocess.run([
        'curl', '-s',
        '-F', f'chat_id={CHAT_ID}',
        '-F', f'caption={caption}',
        '-F', f'document=@{filepath}',
        f'https://api.telegram.org/bot{BOT_TOKEN}/sendDocument'
    ])

def send_pyrogram(filepath, caption):
    try:
        from pyrogram import Client
        app = Client('tg_runtime', api_id=API_ID, api_hash=API_HASH,
                     session_string=SESSION, no_updates=True)
        with app:
            for _ in app.get_dialogs(): pass
            app.send_document(chat_id=int(CHAT_ID), document=filepath, caption=caption)
        print(f"Sent via Pyrogram: {filepath}")
        return True
    except Exception as e:
        print(f"Pyrogram error: {e}")
        return False

for rzip in result_zips:
    if not Path(rzip).exists():
        continue

    size = Path(rzip).stat().st_size
    caption = f"✅ Results: {basename}"

    if size <= 52428800:
        send_bot_api(rzip, caption)
    else:
        send_pyrogram(rzip, caption)
TGEOF
            fi

          done < new_apk-target.txt

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-scan-results
          path: results/
          retention-days: 30
          if-no-files-found: warn